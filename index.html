<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Limbo-style 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #fx { pointer-events: none; }
  #text { position: fixed; left: 0; right: 0; bottom: 14%; text-align: center;
    color: #d8d6cc; font: 300 clamp(14px, 2.4vw, 22px) Georgia, 'Times New Roman', serif;
    letter-spacing: .12em; opacity: 0; transition: opacity 1.6s ease; pointer-events: none;
    text-shadow: 0 0 12px #000; padding: 0 16px; }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #e4e2d8; pointer-events: none;
    font-family: Georgia, 'Times New Roman', serif; transition: opacity 2.5s ease; }
  #title h1 { font-weight: 300; letter-spacing: .5em; font-size: clamp(26px, 6vw, 56px);
    margin: 0 0 0 .5em; text-shadow: 0 0 30px #000; }
  #title p { letter-spacing: .3em; font-size: clamp(11px, 1.6vw, 15px); opacity: .55;
    animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .15; } }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #000; color: #aaa; font: 16px Georgia, serif; letter-spacing: .2em; text-align: center; padding: 24px; }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>
<div id="title"><h1 id="titleName"></h1><p id="titleTap"></p></div>
<div id="text"></div>
<div id="rotate"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
